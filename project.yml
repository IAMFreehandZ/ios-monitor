name: MonitorDiagnostics
options:
  bundleIdPrefix: com.iamfreehandz.iosmonitor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    MONITOR_SOURCE_COMMIT: local
    MONITOR_XCODE_VERSION: unrecorded
    MONITOR_SDK: unrecorded
packages:
  MonitorCore:
    path: .
targets:
  MonitorDiagnostics:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamfreehandz.iosmonitor.diagnostics
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MonitorCore
      - target: MonitorActivity
        embed: true
  MonitorActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamfreehandz.iosmonitor.diagnostics.activity
        INFOPLIST_FILE: Widget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamfreehandz.iosmonitor.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MonitorDiagnostics
    dependencies:
      - target: MonitorDiagnostics
schemes:
  MonitorDiagnostics:
    build:
      targets:
        MonitorDiagnostics: all
        MonitorActivity: all
    test:
      targets:
        - MonitorUITests
